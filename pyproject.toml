[project]
name = "local-siri-on-ipod-touch-4"
version = "0.1.0"
description = "Helper scripts: firmware download/decryption, dylib repair and model conversion"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cryptography>=42",
    "remotezip>=0.12",
    "numpy>=1.26,<2.3",
    "torch>=2.2",
    "transformers>=4.48",
    "safetensors>=0.4",
    "tokenizers>=0.21",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E701", "E702", "E741", "E731", "E501", "B023"]
