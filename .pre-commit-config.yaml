# Run `pre-commit install` once; hooks then run on every commit (`pre-commit run -a` for all files).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=400]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [-x, --severity=warning]
  - repo: local
    hooks:
      - id: no-apple-binaries-or-models
        name: no Mach-O binaries, disk images or model files
        entry: scripts/hooks/no-binaries.sh
        language: script
        types: [file]
